apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-backend-deployment
  labels:
    app: rust-backend
spec:
  replicas: 1 # You can scale this up for high availability
  selector:
    matchLabels:
      app: rust-backend
  template:
    metadata:
      labels:
        app: rust-backend
    spec:
      containers:
        - name: rust-backend
          image: rust_backend:latest # Assuming you've built this image and it's accessible in your cluster (e.g., private registry, or pre-built)
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://admin:123456789@postgres-db-service:5432/vulndb # Use the Kubernetes service name for the DB
          volumeMounts:
            - name: trivy-reports-volume
              mountPath: /app/trivy_reports
      volumes:
        - name: trivy-reports-volume
          persistentVolumeClaim:
            claimName: trivy-reports-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rust-backend-service
spec:
  selector:
    app: rust-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP # Default, accessible only within the cluster. Use NodePort or LoadBalancer for external access.