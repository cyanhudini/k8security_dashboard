apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4
          envFrom:
            - secretRef:
                name: pgadmin-credentials
          env:
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: 'False'
          ports:
            - containerPort: 80
          volumeMounts:
            - name: pgadmin-persistent-storage
              mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-persistent-storage
          persistentVolumeClaim:
            claimName: pgadmin-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
spec:
  selector:
    app: pgadmin
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 80
  type: NodePort # Or LoadBalancer if your cluster supports it and you want public access