apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy-scanner-deployment
  labels:
    app: trivy-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trivy-scanner
  template:
    metadata:
      labels:
        app: trivy-scanner
    spec:
      serviceAccountName: default # Or the custom ServiceAccount you created
      containers:
        - name: trivy-scanner
          image: aquasec/trivy:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                trivy k8s --format json -o /trivy_reports/results.json
                sleep 86400;
              done
          volumeMounts:
            - name: trivy-kubeconfig-volume
              mountPath: /root/.kube
              readOnly: true
            - name: trivy-cache-volume
              mountPath: /root/.cache/trivy
            - name: trivy-reports-volume
              mountPath: /trivy_reports
      volumes:
        - name: trivy-kubeconfig-volume
          hostPath:
            path: /root/.kube # This maps the host's kubeconfig into the pod.
            type: Directory
        - name: trivy-cache-volume
          persistentVolumeClaim:
            claimName: trivy-cache-pvc
        - name: trivy-reports-volume
          persistentVolumeClaim:
            claimName: trivy-reports-pvc